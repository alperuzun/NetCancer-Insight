services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_ORIGIN=http://localhost:3000
      - JSONL_CHUNKS_DIR=/app/llm_data/chunks
      - DB_PATH=/app/data/db.sqlite
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8001
    volumes:
      - ./data:/app/data
      - ./llm_data:/app/llm_data:ro
      - ./backend/gene_data:/app/gene_data:ro
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8001"
    volumes:
      - ./data/chroma:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
